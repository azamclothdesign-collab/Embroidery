upstream embroidery_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream embroidery_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name embdesigens.com www.embdesigens.com;

  client_max_body_size 32m;

  location /health {
    proxy_pass http://embroidery_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(auth|admin|products|categories|cart|wishlist|orders|customers|contact|account)/ {
    proxy_pass http://embroidery_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $scheme://$host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://embroidery_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
