# /etc/nginx/sites-available/embdesigens.com
# Run certbot first (or use the bootstrap block in README), then enable this file.

limit_req_zone $binary_remote_addr zone=emb_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=emb_hooks:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=emb_dl:10m rate=2r/s;

upstream emb_web { server 127.0.0.1:3000; keepalive 32; }
upstream emb_api { server 127.0.0.1:4000; keepalive 16; }

server {
  listen 80;
  listen [::]:80;
  server_name embdesigens.com www.embdesigens.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://embdesigens.com$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.embdesigens.com;
  ssl_certificate     /etc/letsencrypt/live/embdesigens.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/embdesigens.com/privkey.pem;
  return 301 https://embdesigens.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name embdesigens.com;

  ssl_certificate     /etc/letsencrypt/live/embdesigens.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/embdesigens.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  server_tokens off;
  client_max_body_size 210m;          # admin ZIP uploads (MAX_ZIP_MB=200 + overhead)
  client_body_timeout 300s;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Real client IP for the apps; never trust a client-sent X-Forwarded-For.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # Product images: pre-sized WebP written by the backend.
  location /media/ {
    alias /var/lib/embroidery/storage/media/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff;
    types { image/webp webp; }
    default_type application/octet-stream;
  }

  # Payment provider callbacks (signed / re-verified by the backend).
  location /hooks/ {
    limit_req zone=emb_hooks burst=20 nodelay;
    proxy_pass http://emb_api;
  }

  # Signed, short-lived ZIP downloads (streamed, counted).
  location /dl/ {
    limit_req zone=emb_dl burst=10 nodelay;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_pass http://emb_api;
  }

  # The backend's internal /v1 API is NOT exposed publicly.
  location /v1/ { return 404; }
  location /health/ { allow 127.0.0.1; deny all; proxy_pass http://emb_api; }

  location /_next/static/ {
    proxy_pass http://emb_web;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /admin/upload/ {
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_pass http://emb_web;
  }

  location / {
    limit_req zone=emb_general burst=60 nodelay;
    proxy_pass http://emb_web;
  }
}
